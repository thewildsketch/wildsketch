<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Full-Bleed Square Social Media Avatar Container (Kraft Paper Background) -->
  <rect width="100" height="100" fill="#E6D7C3" />
  
  <!-- Optimized Asymmetrical W Logo with Grounded Spine Line and Floating Head -->
  <g transform="translate(16.0, 18.1) scale(2.0)">
    <!-- Asymmetrical W (Left taller, Right shorter) -->
    <path d="M7 6 L11.2 25 L16.8 14 L21 25 L25 10" stroke="#1E1B18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Smooth Spine line wrapping the bottom-right V-tip -->
    <path d="M5 28 C 11 29, 17 28.5, 21.2 26 C 23.8 24.2, 25.8 22.8, 27.5 21.5" stroke="#1E1B18" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Head Dot suspended with a clear gap next to the right leg -->
    <circle cx="31" cy="20.5" r="1.8" fill="#C26A38" />
  </g>
</svg>
